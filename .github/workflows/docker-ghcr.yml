name: Build & Push Docker Image (GHCR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      K8S_REPO: HarrysK8sCluster/k8s-website
      IMAGE_NAME_LC: HarrysK8sCluster/homepage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC  }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC  }}:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Checkout k8s repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.K8S_REPO }}
          path: k8s
          token: ${{ secrets.GH_PAT }}

      - name: Update image tag in k8s manifests
        run: |
          cd k8s
          sed -i "s|\(newTag:\).*|\1 ${GITHUB_SHA}|" kustomization.yaml

      - name: Commit and push k8s changes
        run: |
          cd k8s
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update wiki image to ${GITHUB_SHA}" || echo "Nothing to commit"
          git push