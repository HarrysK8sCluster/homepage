<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" fill="none" role="img" aria-label="Request flow diagram">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#60A5FA" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F87171" />
    </marker>

    <style>
      .label { font: 600 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji"; fill: #E5E7EB; letter-spacing: 0.2px; }
      .sub { font: 500 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #9CA3AF; }
      .num { font: 700 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #0B1220; }

      .nodeBlue { fill: #0B1220; stroke: #3B82F6; stroke-width: 2; }
      .nodeRed { fill: #0B1220; stroke: #EF4444; stroke-width: 2; }
      .chipBlue { fill: #60A5FA; }
      .chipRed { fill: #F87171; }

      .flowBlue { stroke: #60A5FA; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .flowRed { stroke: #F87171; stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
      .tapRed { stroke: #F87171; stroke-width: 3; fill: none; }
      .flow404 { stroke: #F87171; stroke-width: 3; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowRed); }
    </style>
  </defs>

  <!-- main column geometry -->
  <!-- nodes are 520x64, centered at x=300 -->
  <!-- x = 40, y starts at 20 with step 110 -->

  <!-- flows (blue) -->
  <path class="flowBlue" d="M300 86 V122" />
  <path class="flowBlue" d="M300 196 V232" />
  <path class="flowBlue" d="M300 306 V342" />
  <path class="flowBlue" d="M300 416 V452" />
  <path class="flowBlue" d="M300 526 V562" />
  <path class="flowBlue" d="M300 636 V672" />
  <path class="flowBlue" d="M300 746 V782" />

  <!-- error bus (500) -->
  <path d="M640 398 V810" stroke="#F87171" stroke-width="10" stroke-linecap="round" />

  <!-- error flows: 404 (distinct dashed path) -->
  <path class="flow404" d="M560 366 H628 A12 12 0 0 0 640 354 V322 A12 12 0 0 1 652 310 H775" />

  <!-- error flows: taps into 500 bus (no arrows before bundling) -->
  <path class="tapRed" d="M560 398 H640" />
  <path class="tapRed" d="M560 492 H640" />
  <path class="tapRed" d="M560 602 H640" />
  <path class="tapRed" d="M560 712 H640" />
  <path class="tapRed" d="M560 810 H640" />

  <!-- error flows: bus -> Error 500 -->
  <path class="flowRed" d="M640 470 H775" />

  <!-- error flows: handlers -> Response (separate return paths; not bundled with Response->500 tap) -->
  <path class="flowRed" d="M1040 310 H1148 Q1160 310 1160 322 V828 Q1160 840 1148 840 H565" />
  <path class="tapRed" d="M1040 470 H1148 Q1160 470 1160 482 V580" />

  <!-- Nodes (blue main path) -->
  <g filter="url(#shadow)">
    <!-- 1 -->
    <rect class="nodeBlue" x="40" y="20" width="520" height="64" rx="16" />
    <circle class="chipBlue" cx="72" cy="52" r="14" />
    <text class="num" x="72" y="57" text-anchor="middle">1</text>
    <text class="label" x="100" y="50">DocumentRoot</text>
    <text class="sub" x="100" y="72">Entry: <tspan fill="#CBD5E1">html/index.php</tspan></text>

    <!-- 2 -->
    <rect class="nodeBlue" x="40" y="130" width="520" height="64" rx="16" />
    <circle class="chipBlue" cx="72" cy="162" r="14" />
    <text class="num" x="72" y="167" text-anchor="middle">2</text>
    <text class="label" x="100" y="160">Runtime</text>
    <text class="sub" x="100" y="182">APP_ENV dev / prod (debug + cache)</text>

    <!-- 3 -->
    <rect class="nodeBlue" x="40" y="240" width="520" height="64" rx="16" />
    <circle class="chipBlue" cx="72" cy="272" r="14" />
    <text class="num" x="72" y="277" text-anchor="middle">3</text>
    <text class="label" x="100" y="270">Bootstrap Twig</text>
    <text class="sub" x="100" y="292">templates + extensions + manifest.json</text>

    <!-- 4 -->
    <rect class="nodeBlue" x="40" y="350" width="520" height="64" rx="16" />
    <circle class="chipBlue" cx="72" cy="382" r="14" />
    <text class="num" x="72" y="387" text-anchor="middle">4</text>
    <text class="label" x="100" y="380">Routing</text>
    <text class="sub" x="100" y="402">routes.yaml content/{page}.page</text>

    <!-- 5 -->
    <rect class="nodeBlue" x="40" y="460" width="520" height="64" rx="16" />
    <circle class="chipBlue" cx="72" cy="492" r="14" />
    <text class="num" x="72" y="497" text-anchor="middle">5</text>
    <text class="label" x="100" y="490">Prod Cache</text>
    <text class="sub" x="100" y="512">sha256(page) var/cache/dsl hit / miss</text>

    <!-- 6 -->
    <rect class="nodeBlue" x="40" y="570" width="520" height="64" rx="16" />
    <circle class="chipBlue" cx="72" cy="602" r="14" />
    <text class="num" x="72" y="607" text-anchor="middle">6</text>
    <text class="label" x="100" y="600">DSL Pipeline</text>
    <text class="sub" x="100" y="622">parse AST normalize</text>

    <!-- 7 -->
    <rect class="nodeBlue" x="40" y="680" width="520" height="64" rx="16" />
    <circle class="chipBlue" cx="72" cy="712" r="14" />
    <text class="num" x="72" y="717" text-anchor="middle">7</text>
    <text class="label" x="100" y="710">Render</text>
    <text class="sub" x="100" y="732">Twig elements + inline macros @(...)</text>

    <!-- 8 -->
    <rect class="nodeBlue" x="40" y="790" width="520" height="64" rx="16" />
    <circle class="chipBlue" cx="72" cy="822" r="14" />
    <text class="num" x="72" y="827" text-anchor="middle">8</text>
    <text class="label" x="100" y="820">Response</text>
    <text class="sub" x="100" y="842">HTML (prod: cached PHP; dev: echo)</text>
  </g>

  <!-- Error handling lane -->
  <g filter="url(#shadow)">
    <rect class="nodeRed" x="780" y="278" width="260" height="64" rx="16" />
    <circle class="chipRed" cx="812" cy="310" r="14" />
    <text class="num" x="812" y="315" text-anchor="middle">!</text>
    <text class="label" x="840" y="308">Error 404</text>
    <text class="sub" x="840" y="330">no route match</text>

    <rect class="nodeRed" x="780" y="438" width="260" height="64" rx="16" />
    <circle class="chipRed" cx="812" cy="470" r="14" />
    <text class="num" x="812" y="475" text-anchor="middle">!</text>
    <text class="label" x="840" y="468">Error 500</text>
    <text class="sub" x="840" y="490">exception during pipeline</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="680" y="50" width="380" height="132" rx="16" fill="#0B1220" stroke="#334155" stroke-width="1.5" />
    <path d="M710 85 H890" stroke="#60A5FA" stroke-width="4" marker-end="url(#arrowBlue)" />
    <text class="sub" x="940" y="90">main flow</text>
    <path d="M710 120 H890" stroke="#F87171" stroke-width="4" marker-end="url(#arrowRed)" />
    <text class="sub" x="940" y="125">error flow</text>
    <path d="M710 155 H890" stroke="#F87171" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrowRed)" />
    <text class="sub" x="940" y="160">404 path</text>
  </g>
</svg>

